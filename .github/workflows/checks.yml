name: Foundation checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python scripts/export_openapi.py --check
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:calendar
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shift_test
          POSTGRES_PASSWORD: shift_test
          POSTGRES_DB: shift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shift_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHIFT_DATABASE_URL: postgresql+psycopg://shift_test:shift_test@127.0.0.1:5432/shift_test
      SHIFT_TEST_POSTGRES_URL: postgresql+psycopg://shift_test:shift_test@127.0.0.1:5432/shift_test
      SHIFT_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run python scripts/prepare_test_postgres.py
      - run: uv run alembic upgrade head
      - run: uv run pytest apps/api/tests/test_postgres.py -q
