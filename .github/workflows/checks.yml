name: Foundation checks
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python scripts/export_openapi.py --check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shift_test_owner
          POSTGRES_PASSWORD: fictional_ci_only
          POSTGRES_DB: shift_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shift_test_owner -d shift_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
      - run: uv sync --locked
      - run: uv run pytest -q
        env:
          SHIFT_TEST_POSTGRES_URL: postgresql+psycopg://shift_test_owner:fictional_ci_only@127.0.0.1:5432/shift_identity_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth
