[project]
name = "shift-workforce"
version = "0.1.0"
description = "SHIFT workforce API and CP-SAT scheduling foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "ortools>=9.12,<10",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17.4",
]
[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
[tool.uv]
package = false

[tool.ruff]
line-length = 100
